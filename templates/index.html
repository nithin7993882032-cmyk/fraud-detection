<!DOCTYPE html>
<html>
<head>
    <title>AI Fraud Detection</title>
    <style>
        body {
            font-family: Arial;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: white;
            text-align: center;
            padding: 40px;
        }

        h1 {
            margin-bottom: 30px;
        }

        .box {
            background: #1e293b;
            padding: 30px;
            border-radius: 10px;
            display: inline-block;
        }

        input {
            padding: 12px;
            margin: 10px;
            width: 220px;
            border-radius: 6px;
            border: none;
        }

        button {
            padding: 12px 25px;
            background: #22c55e;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #16a34a;
        }

        #result {
            margin-top: 20px;
            font-size: 22px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<h1>💳 AI Fraud Detection System</h1>

<div class="box">
    <input id="amount" placeholder="Transaction Amount"><br>
    <input id="distance" placeholder="Distance"><br>
    <input id="transactions" placeholder="Transactions"><br>

    <button onclick="predict()">Check Fraud</button>

    <div id="result"></div>
</div>

<script>
function predict() {
    fetch("/predict", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            amount: document.getElementById("amount").value,
            distance: document.getElementById("distance").value,
            transactions: document.getElementById("transactions").value
        })
    })
    .then(res => res.json())
    .then(data => {
        document.getElementById("result").innerText =
            data.result + " (" + data.probability + "%) - " + data.risk;
    });
}
</script>

</body>
</html>
